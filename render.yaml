services:
  # ─────────────────────────────────────────────────────
  # 1. Mnemonic WebApp (Next.js - Telegram Mini App)
  # ─────────────────────────────────────────────────────
  - type: web
    name: mnemonic-webapp
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    healthCheckPath: /

